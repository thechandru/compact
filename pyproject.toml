[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-scheme"
dynamic = ["version"]
description = "Tiny implementation of scheme in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Chandru Subramanian", email = "hello@chandru.blog"}]
keywords = ["scheme", "lisp", "interpreter", "embedded", "interop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["fastcore"]

[project.urls]
Repository = "https://github.com/thechandru/compact"
Documentation = "https://thechandru.github.io/compact/"

[project.entry-points.nbdev]
compact = "compact._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "compact.__version__"}

[tool.setuptools.packages.find]
include = ["compact"]

[tool.nbdev]
